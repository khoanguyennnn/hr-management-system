<div id="view-employees" class="view-section">
    <header class="page-header">
        <h1 class="page-title" id="btn-nav-home">HR Management <span>Portal</span></h1>
        <button class="btn btn-secondary" id="btn-nav-leaves">View Leaves Request</button>
    </header>

    <section class="card">
        <header class="card-header">
            <h2>Employee List</h2>
            <button class="btn btn-primary" id="btn-show-add-employee">Add Employee</button>
        </header>
        
        <div class="form-container hidden" id="add-employee-form-container">
            <h3 id="employee-form-title" style="margin-bottom: 1rem;">Add New Employee</h3>
            <form id="add-employee-form">
                <div class="input-group">
                    <label for="emp-name">Name</label>
                    <input type="text" id="emp-name" required placeholder="John Doe">
                </div>
                <div class="input-group">
                    <label for="emp-dept">Department</label>
                    <input type="text" id="emp-dept" required placeholder="Engineering">
                </div>
                <div class="input-group">
                    <label for="emp-leave">Leave Balance</label>
                    <input type="number" id="emp-leave" required min="0" placeholder="10">
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" id="btn-cancel-employee">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>

        <div class="table-container">
            <table id="employees-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Department</th>
                        <th>Leave Balance</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Populated by JS -->
                </tbody>
            </table>
        </div>
    </section>
</div>
