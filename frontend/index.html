<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR Management System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <div class="app-container">
        <!-- HOME VIEW -->
        <div id="view-home" class="view-section">
            <div class="home-content">
                <h1 class="main-title">HR Management <span>Portal</span></h1>
                <div class="home-actions">
                    <button class="btn-animated" id="btn-go-employees">
                        <span>Employees</span>
                    </button>
                    <button class="btn-animated" id="btn-go-leaves">
                        <span>Leaves Request</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- EMPLOYEES VIEW -->
        <div id="view-employees" class="view-section hidden">
            <header class="page-header">
                <h1 class="page-title" id="btn-nav-home">HR Management <span>Portal</span></h1>
                <button class="btn btn-secondary" id="btn-nav-leaves">View Leaves Request</button>
            </header>

            <section class="card">
                <header class="card-header">
                    <h2>Employee List</h2>
                    <button class="btn btn-primary" id="btn-show-add-employee">Add Employee</button>
                </header>

                <div class="form-container hidden" id="add-employee-form-container">
                    <h3 id="employee-form-title" style="margin-bottom: 1rem;">Add New Employee</h3>
                    <form id="add-employee-form">
                        <div class="input-group">
                            <label for="emp-name">Name</label>
                            <input type="text" id="emp-name" required placeholder="John Doe">
                        </div>
                        <div class="input-group">
                            <label for="emp-dept">Department</label>
                            <input type="text" id="emp-dept" required placeholder="Engineering">
                        </div>
                        <div class="input-group">
                            <label for="emp-leave">Leave Balance</label>
                            <input type="number" id="emp-leave" required min="0" placeholder="10">
                        </div>
                        <div class="form-actions">
                            <button type="button" class="btn btn-secondary" id="btn-cancel-employee">Cancel</button>
                            <button type="submit" class="btn btn-primary">Save</button>
                        </div>
                    </form>
                </div>

                <div class="table-container">
                    <table id="employees-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Department</th>
                                <th>Leave Balance</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>
            </section>
        </div>

        <!-- LEAVES VIEW -->
        <div id="view-leaves" class="view-section hidden">
            <header class="page-header">
                <h1 class="page-title" id="btn-nav-home">HR Management <span>Portal</span></h1>
                <button class="btn btn-secondary" id="btn-nav-employees">View Employees</button>
            </header>

            <section class="card">
                <header class="card-header">
                    <h2>Leave List</h2>
                    <button class="btn btn-primary" id="btn-show-add-leave">Request Leave</button>
                </header>

                <div class="form-container hidden" id="add-leave-form-container">
                    <form id="add-leave-form">
                        <div class="input-group">
                            <label for="leave-emp">Employee ID</label>
                            <input type="number" id="leave-emp" required placeholder="Employee ID (e.g. 1)">
                        </div>
                        <div class="input-group">
                            <label for="leave-start">Start Date</label>
                            <input type="date" id="leave-start" required>
                        </div>
                        <div class="input-group">
                            <label for="leave-end">End Date</label>
                            <input type="date" id="leave-end" required>
                        </div>
                        <div class="input-group">
                            <label for="leave-reason">Reason</label>
                            <input type="text" id="leave-reason" required placeholder="Vacation">
                        </div>
                        <div class="form-actions">
                            <button type="button" class="btn btn-secondary" id="btn-cancel-leave">Cancel</button>
                            <button type="submit" class="btn btn-primary">Submit</button>
                        </div>
                    </form>
                </div>

                <div class="table-container">
                    <table id="leaves-table">
                        <thead>
                            <tr>
                                <th>Employee ID</th>
                                <th>Name</th>
                                <th>Start Date</th>
                                <th>End Date</th>
                                <th>Reason</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="toast hidden"></div>

    <script type="module" src="js/app.js"></script>
</body>

</html>
